name: Process theme submission

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'theme-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract and validate theme JSON
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? '';

            // Pull out the JSON code block from the issue body
            const match = body.match(/```json\s*([\s\S]*?)```/);
            if (!match) {
              core.setFailed('No JSON code block found in issue body.');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: '❌ **Could not process this theme submission.**\n\nNo JSON code block was found in the issue body. Please edit your issue and include the theme JSON inside a ` ```json ` code block.\n\nSee the [contribution guide](https://github.com/${{ github.repository }}/blob/main/library/CONTRIBUTING.md) for the expected format.',
              });
              return;
            }

            let parsed;
            try {
              parsed = JSON.parse(match[1]);
            } catch (err) {
              core.setFailed(`Invalid JSON: ${err.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ **Could not process this theme submission.**\n\nThe JSON block contains a syntax error:\n\`\`\`\n${err.message}\n\`\`\`\nPlease fix the JSON and reopen the issue.`,
              });
              return;
            }

            // Accept both a bare theme object and a wrapped { id, name, themes } object
            let entry;
            if (parsed.themes && parsed.id) {
              entry = parsed;
            } else if (parsed.base) {
              // Single bare HeadlampTheme
              const id = (parsed.name ?? 'theme')
                .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'theme';
              entry = { id, name: parsed.name ?? 'Community Theme', description: '', tags: [], themes: [parsed] };
            } else {
              core.setFailed('Unrecognised JSON format.');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: '❌ **Unrecognised JSON format.** The JSON must be either a `HeadlampTheme` object or a library entry `{ id, name, description, tags, themes }`.',
              });
              return;
            }

            core.setOutput('entry', JSON.stringify(entry));
            core.setOutput('id', entry.id);

      - name: Write theme file and open PR
        if: steps.extract.outputs.id != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const entry = JSON.parse(${{ toJSON(steps.extract.outputs.entry) }});
            const id = ${{ toJSON(steps.extract.outputs.id) }};
            const issueNumber = context.payload.issue.number;
            const issueAuthor = context.payload.issue.user.login;
            const branchName = `theme-submission/${id}-issue-${issueNumber}`;
            const filePath = `library/themes/${id}.json`;
            const fileContent = JSON.stringify(entry, null, 2) + '\n';
            const base64Content = Buffer.from(fileContent).toString('base64');

            // Check if a file already exists with this id
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
              });
              existingSha = existing.data.sha;
            } catch {
              // File does not exist yet — fine
            }

            // Get the SHA of main to create the branch from
            const mainRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });

            // Create or reset the branch
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: mainRef.data.object.sha,
              });
            } catch (err) {
              if (err.status === 422) {
                // Branch already exists — update it
                await github.rest.git.updateRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branchName}`,
                  sha: mainRef.data.object.sha,
                  force: true,
                });
              } else {
                throw err;
              }
            }

            // Commit the theme file to the branch
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              message: `library: add ${entry.name} theme (closes #${issueNumber})`,
              content: base64Content,
              branch: branchName,
              ...(existingSha ? { sha: existingSha } : {}),
            });

            // Open the PR
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `library: add "${entry.name}" theme`,
              body: [
                `Adds the **${entry.name}** theme submitted in #${issueNumber} by @${issueAuthor}.`,
                '',
                '**Automated checks will validate:**',
                '- Required library fields are present',
                '- Theme ID is unique',
                '- Contrast thresholds pass (WCAG AA)',
                '- The library and website still build',
                '',
                `Closes #${issueNumber}`,
              ].join('\n'),
              head: branchName,
              base: 'main',
              draft: true,
            });

            // Comment on the issue with the PR link
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `✅ **Thanks for your theme submission, @${issueAuthor}!**`,
                '',
                `A draft PR has been opened automatically: **${pr.data.html_url}**`,
                '',
                'A maintainer will review it shortly. CI will run contrast and validation checks on the theme. If anything fails, the PR will be updated.',
              ].join('\n'),
            });
