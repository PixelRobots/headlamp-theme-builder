name: Theme library check

on:
  push:
    branches:
      - main
    paths:
      - 'library/**'
      - 'public/library/**'
      - 'src/library/themes/**'
      - 'schemas/**'
      - 'scripts/build-public-library.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/theme-library-check.yml'
  pull_request:
    paths:
      - 'library/**'
      - 'public/library/**'
      - 'src/library/themes/**'
      - 'schemas/**'
      - 'scripts/build-public-library.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/theme-library-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate library files
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm run build:library

      - name: Check generated library files
        if: github.event_name == 'pull_request'
        run: npm run check:library

      - name: Build website
        run: npm run build

      - name: Commit generated library files
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "$(git status --porcelain library public/library)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add library public/library
            git commit -m "chore: Update generated theme library"
            git push
          fi
