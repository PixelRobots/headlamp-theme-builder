name: Theme library check

on:
  push:
    branches:
      - main
    paths:
      - 'library/**'
      - 'src/library/themes/**'
      - 'schemas/**'
      - 'scripts/build-public-library.mjs'
      - 'scripts/theme-library-pr-comment.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/theme-library-check.yml'
  pull_request:
    paths:
      - 'library/**'
      - 'src/library/themes/**'
      - 'schemas/**'
      - 'scripts/build-public-library.mjs'
      - 'scripts/theme-library-pr-comment.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/theme-library-check.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate library files
        run: npm run build:library

      - name: Commit generated catalog files
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "$(git status --porcelain library/README.md library/previews)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add library/README.md library/previews
            git commit -m "chore: Update generated theme catalog"
            git push
          fi
          echo "PR_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Comment community theme preview
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/theme-library-pr-comment.mjs --post

      - name: Build website
        run: npm run build
